- id: a-autoragbench
  priority: "core"
  why_priority: "开放代码 RAG 开发、隐藏评测与过拟合归因是可迁移的 Agent/ML Systems 技能；论文有源码但没有本站独立 H800 复现，本篇为用户指定提前发布。"
  date: "2026-11-23"
  title: "AI 能自己优化 RAG 吗？从自动写代码到验证检索质量"
  topic: "RAG 自动研发与 Agent 评测"
  purpose: "让 Agent 自动设计和修改检索代码可以降低试错成本，但反复在开发问题上测试也可能让指标失真。"
  takeaway: "你会理解怎样隔离训练与隐藏测试、冻结代码并使用固定回答模型判断 RAG 修改是否真正有效。"
  contribution_type: "研究论文 / Benchmark"
  contributions:
    - "建立九项任务的开放代码 RAG 开发基准：Agent 从零编写可运行的检索服务，而非只在固定参数组合中搜索。"
    - "把最终系统评测与 Agent 开发轨迹评测结合：冻结代码、验证证据、使用隐藏测试和五个固定回答模型比较质量与延迟。"
    - "对九种 Agent 配置进行跨任务对照，并分析早期、最佳和最终版本的分数差异；公开代码与数据以支持后续核查。"
  innovation: "把评测对象从“某条 RAG 管线效果好不好”扩展为“Agent 能否自主研发、迭代并交付一个可验证的 RAG 系统”。"
  innovation_boundary: "不是发明新的检索算法、隐藏测试或多模型评分；新意主要在任务定义与组合评测协议。论文分数属于作者报告，未独立复现；“首个”为作者主张。"
  url: "/notes/2026/11/2026-11-23-autoragbench/"
  visual: "/interactive/2026-11-23-autoragbench-map.html"
  related:
