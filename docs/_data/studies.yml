      why: "旧文说明 Agent 失败时怎样排除环境和评分器故障；本篇把评测扩展到 Agent 自己交付的整个 RAG 系统。"
    - id: a-retrieval
      why: "旧文深入解释语义检索怎样改善证据召回；本篇研究如何让 Agent 选择并验证这些检索方法的组合。"

- id: a-qdrant-cold-hnsw
  priority: "core"
  why_priority: "以有源码和反例 benchmark 的具体优化，训练端到端性能分析、存储缓存与检索系统设计；机制可迁移，但性能结论仅限作者配置。"
  date: "2026-11-22"
  title: "Qdrant 冷盘 HNSW：为什么查询变快，首次请求反而更慢？"
  topic: "RAG 检索系统与存储 I/O"
  purpose: "向量索引在冷盘搜索时要先查邻居地址再读取邻居，提前加载地址表可能减少查询等待，却增加冷启动成本。"
  takeaway: "你会学会区分索引打开、查询和完整请求耗时，并根据缓存、I/O 与召回率决定是否预取。"
  contribution_type: "开源工程改动 / PR"
  contributions:
    - "在打开 HNSW 图索引时提前读取节点邻接表的偏移量（offsets）。"
    - "把原本查询阶段可能先读 offset、再读 links 的串行磁盘等待，部分转移到索引打开阶段。"
    - "公开比较查询延迟、冷启动与完整请求耗时，展示局部提速可能使首次请求更慢。"
  innovation: "在 Qdrant 的特定图存储与 I/O 路径中实现 offset 预取，以减少图遍历时依赖性的存储读取。"
  innovation_boundary: "不是发明 HNSW 或预取原理；仅部分后端实际预热，性能数值来自 PR 作者条件，不代表所有 SSD 或负载。"
  url: "/notes/2026/11/2026-11-22-qdrant-cold-hnsw/"
  visual: "/interactive/2026-11-22-qdrant-cold-hnsw-map.html"
  related:
    - id: a-retrieval
      why: "旧文优化语义表示和召回质量，本篇优化检索图的存储读取；两者分别决定找到什么和多快找到。"
    - id: a-paged-experts
      why: "两篇都在有限快速存储与较慢存储间权衡预取和按需加载，但对象分别是图邻接数据与 MoE 权重。"

- id: a-kvguard
  priority: "core"
  why_priority: "KV Cache 的请求级内存安全是通用 Serving 问题，论文提供跨 vLLM/SGLang 的可核查故障证据。"
  date: "2026-11-13"
  title: "KVGuard：为什么 KV Cache 会悄悄串写其他请求"
  topic: "推理系统安全"
  purpose: "多个请求共享 GPU KV Cache 时，错误映射即使没有 CUDA 越界，也可能污染其他请求的数据。"
  takeaway: "你会掌握 KV Block 所有权、初始化标记与 CPU/GPU 五个检查点，并学习故障注入和调试取舍。"
  contribution_type: "研究论文 / 检查器"
  contributions:
    - "把 KV Cache 错误从一般 GPU 地址越界，推进到跨请求的逻辑所有权和初始化状态错误。"
    - "设计块所有权、shadow metadata 与 CPU/GPU 关键路径检查，覆盖调度、映射及实际读写。"
    - "在 vLLM 和 SGLang 场景评估缺陷检测能力与运行开销，给出作者报告的案例和边界。"
  innovation: "检查 GPU 地址合法但“访问了别的请求的合法 KV 块”的语义安全错误，这是普通地址越界工具难以识别的。"
  innovation_boundary: "不是新发明 PagedAttention 或 CUDA 内存安全；缺陷数量和性能来自论文，适合作为调试/CI 思路而非默认生产零成本防护。"
  url: "/notes/2026/11/2026-11-13-kv-cache-safety/"
  visual: "/interactive/2026-11-13-kv-cache-safety-map.html"
  related:
    - id: a-paged-experts
      why: "两篇都涉及 GPU 内存管理，但 Paged Experts 管理 MoE 权重容量，KVGuard 管理请求 KV 的权限和生命周期。"
    - id: a-agent-eval
      why: "Agent 评测要区分环境故障与模型能力；KV Cache 污染是可能被误判成模型错误的底层故障。"

