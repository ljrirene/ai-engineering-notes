    - "利用专家加载、缓存/驱逐及执行规划，让一部分专家按需搬入显存执行，而不是要求全部权重常驻。"
    - "关注量化权重和 scale 等参数协同搬运、正确性与多请求换页抖动。"
  innovation: "把通用分页/缓存思想落实到 SGLang 的 MoE 专家执行路径，具体处理权重格式、GPU 计算与专家驻留调度。"
  innovation_boundary: "不是通用发明 GPU 分页或 MoE；收益依赖专家命中率、PCIe/内存带宽、量化布局与并发，作者数字未独立复现。"
