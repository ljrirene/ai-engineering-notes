<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paged Experts · 交互架构图</title><style>

yout{grid-template-columns:1fr}main{padding:12px}.details{min-height:0}}</style></head><body><header><strong>✧ AI, Explained</strong><nav><a href="../">首页</a> · <a href="../knowledge-graph.html">知识星图</a> · <a href="../study-qa/">Study QA</a></nav></header><main><div style="color:#087983;font-size:12px;font-weight:800;letter-spacing:.15em">INFERENCE SYSTEMS · INTERACTIVE RESEARCH · 2026-11-07</div><h1>Paged Experts · MoE 权重如何分页</h1><p class="lead">点击节点查看职责、输入输出与失败模式。切换四种视图，比较传统固定 Offload、按需分页、故障回退与受控混合部署。</p><p class="note">这是依据 SGLang v0.5.23 和公开 PR 制作的<strong>独立工程抽象</strong>，不是官方架构图。所有图中行为应以具体版本代码为准；Hybrid 视图不是跨公网传输专家权重。</p><div id="tabs" class="tabs" role="group" aria-label="架构视图切换"></div><p id="caption" class="hint"></p><div class="layout"><div class="stage"><svg id="map" viewBox="0 0 1020 535" role="img" aria-label="Paged Experts 方向依赖图"></svg></div><aside class="details" id="details" aria-live="polite"></aside></div><div class="footer"><a href="../notes/2026/11/2026-11-07-paged-experts/">返回精读全文 →</a><a href="https://github.com/sgl-project/sglang/pull/42557">官方核心 PR →</a><a href="../knowledge-graph.html">查看相关知识 →</a></div></main>
<script>const nodes=[["router","MoE Router",35,100,"model","选择 Top-k Experts","Token hidden state → per-token expert IDs / weights","不可信请求可诱发不同访问模式；需观测分布。"],["planner","Residency Planner",290,100,"trusted","命中、LRU、Wave 决策","Expert IDs + slot map → page-in plan / waves","竞态、无效 slot ID、thrashing。"],["host","Pinned Host Store",35,335,"risk","完整专家权重与量化元数据","Checkpoint → pinned RAM → selected H2D","Host RAM 配额、NUMA、UVA、权重完整性。"],["gpu","GPU Expert Slots",550,100,"trusted","只保留 K 个专家槽","Page-in tensors → resident expert map","显存争用 KV、OOM、scale/zero-point 不一致。"],["runner","Fused GPU MoE",800,100,"model","执行路由到的专家","Expert slot + activation → per-expert output","Runner/量化格式与 no-combine 不兼容。"],["combine","Weighted Combine",800,335,"trusted","按 Router 权重聚合","Per-expert outputs + router scores → layer output","多 wave 重排/数值一致性。"],["kv","KV Cache Budget",550,335,"trusted","管理 KV 与专家槽 HBM 分配","K + max context + concurrency → budget","K 过大挤占 KV、SLO 波动。"],["gate","Admission & SLO",290,335,"external","限制并发、超时与任务范围","Request policy → concurrency / fallback","输入隐私、批次突增、跨域不合规。"]],views=[{"label":"01 · 固定 CPU Offload","desc":"基线：不感知 Top-k 路由，按固定 offload 配置重复搬运权重；不是所有 CPU MoE 引擎的实现。","edges":[["gate","router"],["host","gpu"],["router","gpu"],["gpu","runner"],["runner","combine"],["kv","gpu"]],"focus":["host","gpu"]},{"label":"02 · Paged Experts","desc":"优化：Router 选专家，Residency Planner 只搬未驻留者，必要时分 Wave，再由 GPU Fused Runner 聚合。","edges":[["gate","router"],["router","planner"],["planner","host"],["host","gpu"],["planner","gpu"],["gpu","runner"],["runner","combine"],["kv","gpu"]],"focus":["planner","gpu"]},{"label":"03 · 故障 / 回退","desc":"K 太小、并发太高或量化 scale 漏页时会产生 Thrashing / 错误输出；需 Admission、Oracle 与可回退执行模式。","edges":[["gate","router"],["router","planner"],["planner","gpu"],["gpu","runner"],["runner","combine"],["kv","gpu"],["gate","kv"],["host","gpu"]],"focus":["gate","kv","host"]},{"label":"04 · Controlled Hybrid","desc":"只有批准出域的请求能进入云 GPU；CPU RAM↔GPU 权重分页仍发生在同一机器，不跨公网分页。","edges":[["gate","router"],["router","planner"],["planner","host"],["host","gpu"],["planner","gpu"],["gpu","runner"],["runner","combine"],["kv","gpu"]],"focus":["gate","host"]}];(function(){'use strict';const ns="http://www.w3.org/2000/svg",svg=document.getElementById("map"),tabs=document.getElementById("tabs"),details=document.getElementById("details"),caption=document.getElementById("caption");let mode=0,selected=null;const by=new Map(nodes.map(n=>[n[0],n]));function E(tag,attrs,parent){let el=document.createElementNS(ns,tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));parent?.appendChild(el);return el}function line(text,tag="p"){let el=document.createElement(tag);el.textContent=text;details.appendChild(el)}function show(n){details.replaceChildren();if(!n){line("SYSTEM EXPLORER","h2");line("点击节点，或使用 Tab + Enter 选择组件。选中后只高亮它的上下游依赖。");return}line(n[1],"h2");line("职责","h3");line(n[5]);line("输入 / 输出","h3");line(n[6]);line("边界 / 失败模式","h3");line(n[7]);line("部署视图","h3");line(views[mode].desc)}function highlight(){let rel=new Set([selected]);views[mode].edges.forEach(([a,b])=>{if(a===selected)rel.add(b);if(b===selected)rel.add(a)});svg.querySelectorAll(".node").forEach(el=>{el.classList.toggle("selected",!!selected&&el.dataset.id===selected);el.classList.toggle("dim",!!selected&&!rel.has(el.dataset.id))});svg.querySelectorAll(".edge").forEach(el=>{let on=selected&&(el.dataset.a===selected||el.dataset.b===selected);el.classList.toggle("active",!!on);el.classList.toggle("dim",!!selected&&!on)})}function draw(){tabs.replaceChildren();views.forEach((v,i)=>{let b=document.createElement("button");b.type="button";b.textContent=v.label;b.setAttribute("aria-pressed",String(mode===i));b.onclick=()=>{mode=i;selected=null;draw()};tabs.appendChild(b)});caption.textContent=views[mode].desc;svg.replaceChildren();let defs=E("defs",{},svg),m=E("marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:5,markerHeight:5,orient:"auto"},defs);E("path",{d:"M0 0L10 5L0 10Z",fill:"#7699ac"},m);E("rect",{x:0,y:0,width:1020,height:535,fill:"#fff"},svg);let links=E("g",{},svg),dots=E("g",{},svg);views[mode].edges.forEach(([a,b],i)=>{let A=by.get(a),B=by.get(b),ax=A[2]+90,ay=A[3]+34,bx=B[2]+90,by=B[3]+34,dx=bx-ax,dy=by-ay;if(Math.abs(dx)>Math.abs(dy)){ax+=Math.sign(dx)*85;bx-=Math.sign(dx)*92}else{ay+=Math.sign(dy)*30;by-=Math.sign(dy)*37}let bend=(i%3-1)*23;let path=E("path",{class:"edge",d:"M"+ax+","+ay+" Q"+((ax+bx)/2+bend)+","+((ay+by)/2-bend)+" "+bx+","+by,"marker-end":"url(#arrow)"},links);path.dataset.a=a;path.dataset.b=b});nodes.forEach(n=>{let el=E("g",{class:"node",tabindex:0,role:"button","aria-label":n[1],"data-zone":n[4]},dots);el.dataset.id=n[0];E("rect",{x:n[2],y:n[3],width:180,height:70,rx:12},el);let t=E("text",{x:n[2]+90,y:n[3]+41,"text-anchor":"middle"},el);t.textContent=n[1];const pick=()=>{selected=n[0];show(n);highlight()};el.addEventListener("click",pick);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}})});show(null);highlight()}draw()})();</script></body></html>
